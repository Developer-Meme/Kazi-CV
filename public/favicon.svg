<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Document shape (white page) -->
  <rect x="14" y="10" width="30" height="38" rx="3" fill="white" opacity="0.15"/>

  <!-- Folded corner -->
  <path d="M38 10 L44 16 L38 16 Z" fill="white" opacity="0.25"/>
  <rect x="14" y="10" width="24" height="6" rx="3" fill="none"/>
  <!-- Document lines -->
  <rect x="18" y="22" width="16" height="2" rx="1" fill="white" opacity="0.4"/>
  <rect x="18" y="27" width="22" height="2" rx="1" fill="white" opacity="0.3"/>
  <rect x="18" y="32" width="18" height="2" rx="1" fill="white" opacity="0.3"/>

  <!-- Gold accent bar at bottom of document -->
  <rect x="14" y="44" width="30" height="4" rx="2" fill="url(#gold)" opacity="0.9"/>

  <!-- "K" lettermark, bold, white -->
  <text x="32" y="52" font-family="Georgia, serif" font-size="13" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle" opacity="0.0">K</text>

  <!-- Bold K drawn as paths for crisper rendering -->
  <!-- Vertical stroke -->
  <rect x="30" y="14" width="3.5" height="18" rx="1" fill="white"/>
  <!-- Top diagonal arm -->
  <path d="M33.5 23 L41 14.5 L44 14.5 L36.5 23.5Z" fill="white"/>
  <!-- Bottom diagonal arm -->
  <path d="M33.5 23 L44 31.5 L41 31.5 L33.5 24Z" fill="white"/>

  <!-- Gold underline accent -->
  <rect x="30" y="34" width="12" height="2.5" rx="1.25" fill="url(#gold)"/>
</svg>
